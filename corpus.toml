[[binary]]
name      = "SteamSetup.exe (wine wow64)"
path      = "example_exe/SteamSetup.exe"
note      = "The 32-bit NSIS installer as a real WoW64 process on Wine's 64-bit PE set (roadmap W5). Wine's i386 loader_init maps and binds its whole import graph off the pinned prefix — 30 modules, advapi32 through shfolder — and the guest reaches exemu's win32k through wow64win's thunks into the 64-bit win32u. It runs 7,363,620 instructions with ZERO exceptions delivered and terminates with its own exit code 2; the emulated twin above faults at 92,865,377. That the Wine number is smaller is not a regression: it is a different program that stops for a different reason. What moves this count: the pinned Wine prefix (BOTH halves — a refresh changes the loader itself, not just the libraries), the WoW64 file-system redirector's view of \\windows\\system32, which decides which DLLs the 32-bit loader is handed, and the sandbox contents, since a self-extractor's own file I/O is part of the count. Its window procedures now run: a client callback travels ntdll64!KiUserCallbackDispatcher -> wow64win!user_callbacks[NtUserCallWinProc] -> wow64!Wow64KiUserCallbackDispatcher -> ntdll32!KiUserCallbackDispatcher -> the guest's own 32-bit code, and comes back through NtCallbackReturn (roadmap W5.10). That is what the +329,231 instructions over the 7,363,620 this entry used to pin are: combase's OleMainThreadWndClass procedure and Wine's DefWindowProcW chain actually running. NOTE the clock: on the DEFAULT host clock the same binary now runs 30,803,716 instructions and unpacks its NSIS archive (Temp/nsa1.tmp, nsa2.tmp, 6 artifacts) — the virtual clock this entry pins sends NSIS down a shorter path, the same clock-sensitivity the header documents for the emulated Firefox entry. It still does NOT reach its nsDialogs installer. Re-blessed 7,692,851 -> 7,692,064 (-787) when NtUserGetAtomName (win32u index 0x13d1) landed for roadmap W6.2: user32's dialog manager names a class by its integer atom, and answering that is SHORTER than the path the unserviced stub used to take, so the count falls. Deterministic across three runs. Re-blessed 7,692,064 -> 7,712,812 (**+20,748**) for roadmap W6.4, when exemu started publishing Wine's debug-channel option array instead of leaving the page zeroed. Wine resolves every TRACE/WARN/ERR/FIXME guard against an array at PEB+0x2000 (64-bit ntdll) or PEB+0x1000 (32-bit ntdll), whose terminator entry carries the flags for every unnamed channel; the pinned builtins' own fallback parser ships that default as 0x03 = err+fixme, which is the documented wine(1) default. exemu used to leave the page zeroed, i.e. all four classes OFF -- so this delta is Wine's err/fixme diagnostics actually running, work a real Wine process does and exemu was silently skipping. The attribution is exact rather than inferred: on the SAME build, `WINEDEBUG=-all` reproduces the old pin to the instruction (7,692,064), so the layout move that went with the fix -- the WoW64 CPU-reserved area was sitting exactly on PEB32+0x1000, where the 32-bit builtins were reading their channel flags out of the live 32-bit register save area -- contributes zero. WINEDEBUG in the environment therefore moves this count, and is now an input alongside the pinned prefix and the sandbox. Deterministic across three runs. Re-blessed 7,712,812 -> 7,683,013 (**-29,799**) for roadmap W6.x, when exemu started answering NtGetNlsSectionPtr(type 0xb) with a REAL codepage table instead of a CP_UTF8-marked stub. msvcrt's create_mbcinfo asks for codepage 20127 (US-ASCII -- the CRT's default _MB_CP_SBCS locale) and round-trips all 256 byte values through MultiByteToWideChar/WideCharToMultiByte into 256-byte buffers; against a UTF-8 table the wide->multibyte leg needs 384 bytes, so it returned 0 with ERROR_INSUFFICIENT_BUFFER and msvcrt ran with EMPTY multibyte tables. The attribution is exact: on the pre-fix build `--trace` reports `err:msvcrt:create_mbcinfo WideCharToMultiByte failed for cp 20127, ret=0 (exp 256), error=122` twice, and on this build that line is gone (the only remaining Wine diagnostic is the pre-existing actctx fixme). The count FALLS because the two failed conversions, their err:-channel formatting (on since W6.4) and msvcrt's fallback path are all work that no longer happens. Deterministic across three runs. Re-blessed 7,683,013 -> 8,169,827 (**+486,814**) and artifacts 4 -> 6 for roadmap W6.1, when exemu started MATERIALISING the WinSxS store at prefix creation (crates/app/src/winsxs.rs, staged from Process::load next to the winecoreaudio.drv staging). A real Wine prefix is CREATED with that store -- wineboot turns every builtin's WINE_MANIFEST resource into %WINDIR%\\winsxs\\manifests\\<key>.manifest plus a private copy of the DLL under %WINDIR%\\winsxs\\<key>\\ -- and exemu had never run it, so ntdll!lookup_winsxs found no Microsoft.Windows.Common-Controls 6.0.0.0 assembly and this guest silently got comctl32 **v5**, the build with no themed control replacements and no uxtheme. It now gets **v6**: with WINEDEBUG=+module Wine's own loader reports find_dll_file found L\"C:\\windows\\winsxs\\x86_microsoft.windows.common-controls_6595b64144ccf1df_6.0.2600.2982_none_deadbeef\\COMCTL32.dll\" where it used to report C:\\windows\\system32\\COMCTL32.dll, and process_attach runs COMCTL32's DllMain from that image. The two extra artifacts ARE the store (the manifest and the private copy of the DLL); they are files a real prefix has. The attribution is exact rather than inferred: reverting ONLY the winsxs::stage_comctl6 call in Process::load reproduces the old pin and the old artifact count exactly (7,683,013 / 4 files). Deterministic across three runs.Re-blessed 8,169,827 -> 8,170,007 (**+180**) when `NtUserGetProcessDpiAwarenessContext` (win32u index 0x1435) started answering. `user32!GetThreadDpiAwarenessContext` reads the thread's context out of TEB+0x830 and, when that is 0, asks the syscall with process = -1, truncating the answer to 32 bits; the unserviced stub answered 0, which `GetAwarenessFromDpiAwarenessContext` rejects as DPI_AWARENESS_INVALID, so every DPI-mapping decision in this guest was taken against an invalid context. exemu answers NTUSER_DPI_UNAWARE (0x6010), the context it already stamps into every `win_proc_params` and the one that goes with the 96 DPI `NtUserGetSystemDpiForProcess` reports. The attribution is exact rather than inferred: on THIS build, registering `honest_stub` for 0x1435 alone reproduces 8,169,827 to the instruction (and 14,778,753 on the Firefox row below). Exit code (2) and artifacts (6) unchanged. Deterministic across three runs."
quick     = false
virtual_clock = true
wine_boot = "example_exe/wine-dlls/x86_64-windows"
max_steps = 300000000
outcome   = "exit"
exit_code = 2
steps     = 8170007
tolerance = 0
artifacts = 6

[[binary]]
name      = "SteamSetup.exe (wine wow64, jit)"
path      = "example_exe/SteamSetup.exe"
note      = "The SAME WoW64 run through the block JIT, pinned to the interpreter twin above to the instruction, exit code and artifacts included: any difference between the pair is a JIT bug. 98.5% native, 16.6 blocks per native chain. It already matched before the JIT budget became a ceiling (8,170,007 both ways on main b6cbaea), so what it guards is the Wine path's 32-bit code under WoW64, wow64's mode switches and the client-callback round trips, not the scheduler. Same inputs move it as the entry above. Deterministic across three runs."
quick     = false
virtual_clock = true
jit       = true
wine_boot = "example_exe/wine-dlls/x86_64-windows"
max_steps = 300000000
outcome   = "exit"
exit_code = 2
steps     = 8170007
tolerance = 0
artifacts = 6

[[binary]]
name      = "Firefox Installer.exe (wine wow64)"
path      = "example_exe/Firefox Installer.exe"
note      = "The 32-bit UPX-packed installer on the same WoW64 path. The UPX stub self-decompresses, the inner 7-Zip SFX runs against Wine's kernel32/kernelbase/msvcrt/user32 and unpacks C:\\Temp\\7zS00004040, then exits 1 after 12,467,176 instructions — 2.7x the emulated twin's 4,665,426, with all of the extra work being Wine's own code. Its _beginthreadex now SUCCEEDS: a WoW64 thread is a 64-bit thread entering wow64!Wow64LdrpInitialize with its own sub-4 GiB TEB pair, CPU-reserved area and 32-bit stack (roadmap W5.11), and the +1,998,940 instructions over the 12,467,176 this entry used to pin are that thread running. Still zero exceptions delivered. Two things had to be right for it: the 32-bit stack must be below 4 GiB (one from the 64-bit VirtualAlloc arena at 0x40_0000_0000 reached the guest as 0x12fef8 and it died on its own push ebp), and the scheduler must carry the CPU MODE across a switch — CpuState has no bits field, so the new thread used to resume in whatever mode the main one was in and executed wow64!Wow64LdrpInitialize's rva 0x2ce0 as zeroes. Unchanged by the W5.10 client-callback work: this binary stops before it opens a window, so its count is pinned to the thread wall alone. Same inputs move it as the entry above. Re-blessed 14,466,116 -> 14,466,327 (+211) when NtUserGetAtomName (win32u index 0x13d1) landed for roadmap W6.2 — this binary now gets a real class name back where it used to get an empty one. Deterministic across three runs. Re-blessed 14,466,327 -> 14,480,727 (**+14,400**) for roadmap W6.4 -- same cause as the SteamSetup entry above: Wine's err+fixme channels are now on, as they are in a real Wine process, because exemu publishes the debug-channel option array the two ntdlls resolve against instead of leaving its page zeroed. `WINEDEBUG=-all` on the same build reproduces the old pin exactly (14,466,327). Deterministic across three runs. Re-blessed 14,480,727 -> 14,465,965 (**-14,762**) for roadmap W6.x -- same cause as the SteamSetup entry above: a real codepage 20127 table means msvcrt's create_mbcinfo succeeds instead of failing twice with ERROR_INSUFFICIENT_BUFFER and logging through the err: channel. Re-blessed 14,465,965 -> 14,466,773 (**+808**) for roadmap W6.1, when NtQueryDirectoryFile started answering the class the caller asked for in that class's own layout. This binary makes exactly THREE directory enumerations, all FileIdExtdBothDirectoryInformation (0x3f) -- the class Wine's own FindFirstFileW uses -- and exemu used to answer every class with the FILE_BOTH_DIR_INFORMATION layout AND put that layout's FileName at the struct's padded sizeof (+0x60 instead of +0x5E). Class 0x3f's name is at +0x72, so all three came back EMPTY. The attribution is exact rather than inferred: instrumented on this build the three calls return \"Firefox Installer.exe\", \"Firefox Installer.exe\" and \"7zS00004040\" (IoStatusBlock.Information 0x9c/0x9c/0x88, i.e. name_off + name rather than the padded sizeof), and reverting ONLY crates/os/src/fs.rs + syscall.rs to the previous commit reproduces the old pin to the instruction (14,465,965). So the delta is the inner 7-Zip SFX doing the string work that follows a real file name where it used to get an empty one -- work a real Wine process does and exemu was silently skipping. Artifacts (3) and exit code (1) unchanged. Deterministic across three runs. Re-blessed 14,466,773 -> 14,775,399 (**+308,626**) and artifacts 3 -> 5 for roadmap W6.1 -- the same cause as the SteamSetup entry above but a different consequence, which is why it is spelled out separately. This binary's inner 7-Zip SFX (7zS.sfx.exe) declares Microsoft.Windows.Common-Controls 6.0.0.0 in its own manifest too, so with the store staged Wine's actctx code now FINDS, opens and parses the assembly manifest and builds its redirection sections, where it used to log fixme:actctx:parse_depend_manifests Could not find dependent assembly and give up. It never gets as far as LOADING comctl32 -- WINEDEBUG=+module shows no comctl32 load at all, because it exits before its GUI -- so unlike SteamSetup the whole delta here is the activation-context work itself, not a DLL. Same exact attribution: reverting only the staging call reproduces 14,466,773 / 3 files. Deterministic across three runs. Re-blessed 14,775,399 -> 14,778,753 (**+3,354**) for roadmap W6.2, when GDI got real font objects. `NtGdiHfontCreate` (win32u index 0x1233) used to answer 0, so every `CreateFontIndirectW` in this guest returned NULL and the code that follows a font never ran; it now keeps the LOGFONTW at the head of the ENUMLOGFONTEXDVW and answers an NTGDI_OBJ_FONT handle, and `NtGdiSelectFont`/`NtGdiGetDCObject`/`NtGdiExtGetObjectW`/`NtGdiGetTextMetricsW` answer from it. The attribution is exact rather than inferred: on THIS build, registering `honest_stub` for 0x1233 alone -- every other part of the change, including the new PEB32 table pointer and the font-derived TEXTMETRICW, left in place -- reproduces 14,775,399 to the instruction. Exit code (1) and artifacts (5) unchanged. Deterministic across four runs. NOTE that this binary also needed the OTHER half of the same change to keep exiting cleanly at all: its 32-bit gdi32 indexes `PEB32->GdiSharedHandleTable` (offset 0x94) directly, exemu published the table only at PEB64+0xF8, and the first real HFONT made it compute `0 + slot*24 + 0xe` and take an access violation at 0x54e. Publishing the pointer in the 32-bit PEB -- and mapping the table and the object arena below 4 GiB so a 32-bit pointer can reach them -- is what puts it back at exit 1. Re-blessed 14,778,753 -> 14,778,765 (**+12**) when `NtUserGetProcessDpiAwarenessContext` (win32u index 0x1435) started answering. `user32!GetThreadDpiAwarenessContext` reads the thread's context out of TEB+0x830 and, when that is 0, asks the syscall with process = -1 and truncates the answer to 32 bits; the unserviced stub answered 0, which `GetAwarenessFromDpiAwarenessContext` rejects as DPI_AWARENESS_INVALID. exemu answers NTUSER_DPI_UNAWARE (0x6010), the same context it already stamps into every `win_proc_params` and the one that goes with the 96 DPI `NtUserGetSystemDpiForProcess` reports. The attribution is exact: registering `honest_stub` for 0x1435 alone reproduces 14,778,753 to the instruction. Exit code and artifacts unchanged. Deterministic across three runs."
