note      = "The SAME WoW64 run through the block JIT, pinned to the interpreter twin above to the instruction, exit code and artifacts included. 95.1% native. Its inner 7-Zip SFX's _beginthreadex worker shares the CPU with the main thread, so this is the pair that keeps the scheduler's half of the twin contract honest. Before the JIT budget became a ceiling this run was 14,747,646 (**-31,119**): a chain stopped at the first block boundary AT OR PAST its budget, and the scheduler's retire budget let bulk retirement run through the slice's last step, which the interpreter spends on the switch itself without executing an instruction. Every syscall and the virtual clock agreed in both modes until the first preemptive switch, at instruction 11,030,780, where the JIT left the main thread at rip 0x600136e0 instead of the interpreter's 0x600136de; from then on every switch drifted. The attribution is exact: the JIT ceiling alone gives 14,778,753, the scheduler change alone 14,747,646, both together 14,778,765. Same inputs move it as the entry above. Deterministic across three runs."
