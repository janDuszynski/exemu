# exemu dependency-licence policy — the SHIPPING closure.
#
# Enforced in CI by `.github/workflows/licenses.yml` (roadmap W9.1, acquisition
# A10′). This file governs the crates that are actually compiled into a
# distributable exemu artifact: workspace members, default features, no
# dev-dependencies, no unpublished workspace roots.
#
#     cargo deny --workspace --exclude-dev --exclude-unpublished \
#                --all-features=false check licenses bans sources
#
# The companion policy `deny.dev.toml` covers the *full* graph, including the
# dev-only GPL differential oracle. Keeping them separate is the point: this
# file has **no licence exceptions at all**, so "the shipping closure contains
# zero copyleft" is a mechanically checked claim, not an assertion.
#
# ---------------------------------------------------------------------------
# SCOPE NOTE — the Wine PE DLLs are deliberately NOT covered here.
# ---------------------------------------------------------------------------
# exemu runs Wine's PE builtin DLLs (LGPL-2.1-or-later) as *guest image files*
# loaded at runtime by exemu's own PE loader. They are not a cargo dependency,
# are never linked into or compiled with any exemu crate, and therefore never
# appear in `cargo tree` or in this check. A green run of this file means
# "no copyleft **crate** in the Rust dependency closure" — it does **not** mean
# "no LGPL anywhere in the shipped product".
#
# The Wine runtime is governed instead by `docs/COMPLIANCE.md` (the LGPL
# redistribution checklist) and by the separability check
# `.github/scripts/separability.sh`, which proves no Wine code reaches exemu's
# compiled output. Do not read a green cargo-deny as clearing the LGPL
# question; the two are different obligations.

[graph]
# No `targets` filter: every platform-gated dependency in Cargo.lock is
# licence-checked, including the ones that only build on Linux/Windows/Redox
# (x11-dl, wayland-*, winapi, orbclient …). Checking the union is stricter than
# checking only aarch64-apple-darwin and costs nothing.
all-features = false
exclude-dev = true

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Licences
# ---------------------------------------------------------------------------
# cargo-deny's licence model is an ALLOW-LIST: any SPDX expression that cannot
# be satisfied by the identifiers below fails the build. The deny-list is
# therefore "everything not listed", but the families that are *deliberately*
# excluded are named here so the intent is auditable and so a future reviewer
# does not have to infer it:
#
#   DENIED (reciprocal / copyleft / source-disclosure):
#     GPL-*, AGPL-*, LGPL-*, MPL-*, CDDL-*, EPL-*, CPL-*, OSL-*, SSPL-*,
#     BUSL-*, EUPL-*, CeCILL (except the -B/-C permissive variants), Sleepycat.
#   DENIED (ambiguous / non-OSI / field-of-use restricted):
#     WTFPL (no warranty disclaimer), JSON ("do no evil"), Commons-Clause,
#     anything with no licence field at all.
#
# Named consequence of the deny-list (roadmap W8): **`dynasmrt` is MPL-2.0 and
# is banned.** The W8 JIT emitter is hand-rolled in-repo. MPL-2.0's file-level
# reciprocity would attach to any exemu file containing dynasm-derived code,
# which is incompatible with keeping the JIT a proprietary-licensable asset.
# The ban is enforced twice: by omission from this allow-list, and by name in
# `[bans].deny` below.
[licenses]
allow = [
    # --- the permissive core of the Rust ecosystem ---
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "MIT-0",
    # `unicode-ident` is `(MIT OR Apache-2.0) AND Unicode-3.0`; the AND makes
    # Unicode-3.0 non-optional. Unicode-3.0 is permissive (Unicode Licence v3,
    # BSD-3-Clause-shaped with a data/trademark clause) and OSI-approved.
    "Unicode-3.0",

    # --- exemu's own crates ---
    # PolyForm Noncommercial 1.0.0 is a source-available, NON-open-source
    # licence: it forbids commercial use by third parties. It is listed here
    # only so the workspace's own crates pass their own gate. It must never be
    # used to justify accepting a *third-party* crate under a
    # non-commercial-use licence — that would be a genuine problem, because
    # exemu is intended to be commercially licensable by its owner. Any new
    # third-party crate appearing under this identifier is a defect, not a pass.
    "PolyForm-Noncommercial-1.0.0",
]

# No exceptions. If you believe you need one, it belongs in `deny.dev.toml`
# (dev-only tooling) or it does not belong in exemu.
exceptions = []

# Keep the allow-list a *policy statement* rather than a mirror of today's
# lockfile: entries that no current crate happens to use are fine.
unused-allowed-license = "allow"

# 0.8 is cargo-deny's default. Raise, never lower: a low confidence threshold
# means a licence was matched by fuzzy text similarity rather than by an
# unambiguous SPDX id, which is exactly the situation a compliance gate must
# not wave through.
confidence-threshold = 0.8

[licenses.private]
# Check exemu's own crates too. Their licence is a deliberate choice and the
# gate should notice if one drifts.
ignore = false

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------
[bans]
# Duplicate versions of the same crate (today: bitflags 1/2 and shlex 1/2, both
# dragged in by minifb's non-macOS transitive deps) are a build-size and
# maintenance concern, not a licensing one, and both versions are permissive.
# Left at "allow" deliberately: a gate that prints a 60-line inclusion graph on
# every green run teaches people to ignore its output. Duplicate-version hygiene
# belongs to the dependency-review item (acquisition A13), not to this gate.
multiple-versions = "allow"

# KNOWN GAP, recorded rather than hidden. `wildcards` would catch a
# third-party dependency pinned as `foo = "*"`. It is off because exemu's own
# workspace members depend on each other through `{ workspace = true }`, which
# resolves to a bare `path` with no version requirement; cargo-deny classifies
# every one of those as a wildcard dependency, and `allow-wildcard-paths` does
# not suppress them because the exemu crates are not marked `publish = false`.
# Left at "deny" or "warn" the gate emits ~30 false positives on every green
# run, which is how a compliance gate stops being read.
#
# To re-enable: either add `version = "0.0.4"` alongside `path` in the root
# `[workspace.dependencies]` entries, or mark the workspace members
# `publish = false` (exemu is never published to crates.io). Then set this to
# "deny". Until then the mitigating control is that every third-party
# dependency in this workspace carries a concrete version requirement and
# `Cargo.lock` is committed, so resolution is reproducible regardless.
wildcards = "allow"
allow-wildcard-paths = true

deny = [
    # MPL-2.0. See the licence note above. Belt and braces: even if someone
    # relicensed or vendored it, the crate itself stays out.
    { crate = "dynasmrt", reason = "MPL-2.0 file-level reciprocity is incompatible with the JIT remaining proprietary-licensable (roadmap W8); the emitter is hand-rolled in-repo." },
    { crate = "dynasm", reason = "MPL-2.0; the proc-macro half of dynasmrt." },
]

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
# Provenance hygiene: every third-party crate must come from crates.io. A git
# or private-registry dependency has no published licence metadata a diligence
# reviewer can verify, so it fails the gate until it is explicitly allow-listed
# here with a reason.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
