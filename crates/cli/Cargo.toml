[package]
name = "exemu-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line front-end for the exemu Windows PE emulator."

[lib]
name = "exemu_cli"
path = "src/lib.rs"

[[bin]]
name = "exemu"
path = "src/main.rs"

[dependencies]
exemu-core = { workspace = true }
exemu-app = { workspace = true }
exemu-gui = { workspace = true }
exemu-audio = { workspace = true }

[features]
default = []
# Turn on the interpreter's dynamic opcode-frequency counters (roadmap W8.3) and
# the `exemu run --opcode-profile` report they feed. A separate binary on
# purpose: the instrumentation must never exist in the build the corpus pins
# measure. Build with
#   cargo build --release -p exemu-cli --features opcode-profile
opcode-profile = ["exemu-app/opcode-profile"]

[lints.rust]
unsafe_code = "forbid"
