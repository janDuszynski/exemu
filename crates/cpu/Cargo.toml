[package]
name = "exemu-cpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "An x86-64 instruction decoder and interpreter implementing exemu_core::Cpu."

[dependencies]
exemu-core = { workspace = true }

[dev-dependencies]
exemu-memory = { workspace = true }

[features]
default = []
# Dynamic opcode-frequency profiling (roadmap W8.3). OFF by default: every hook
# site is `#[cfg]`-gated, so the shipping interpreter carries no cost at all and
# an instrumented build cannot perturb the exact corpus instruction counts.
profile = []

[lints.rust]
unsafe_code = "forbid"
